<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoenix Rovigo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px 15px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 14px;
      color: #a0a0a0;
      margin-bottom: 25px;
    }

    /* Sezione Sponsor - K2 Kebab Rovigo senza spazi extra */
    .sponsor-section {
      width: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .sponsor-img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      padding: 0;
    }

    /* Sezione Rosa */
    .roster-section {
      margin-top: 25px;
      text-align: left;
      background-color: #141414;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #262626;
    }
    .roster-section h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #ff4500;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .roster-category {
      margin-bottom: 10px;
    }
    .roster-category h3 {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 4px;
      border-bottom: 1px solid #333;
      padding-bottom: 2px;
    }
    .roster-list {
      list-style: none;
      padding-left: 5px;
      font-size: 14px;
    }
    .roster-list li {
      padding: 3px 0;
    }

    /* Links / Pulsanti */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 20px;
    }
    .link-btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid #333333;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      text-align: center;
    }
    .link-btn:hover {
      background-color: #262626;
      border-color: #555555;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logo e Intestazione -->
    <img src="logo.png" alt="Phoenix Rovigo Logo" class="logo" onerror="this.style.display='none'">
    <h1>Phoenix Rovigo</h1>
    <p class="subtitle">Sito Ufficiale & Social</p>

    <!-- Sponsor K2 Kebab Rovigo (spazi azzerati) -->
    <div class="sponsor-section">
      <img src="k2-kebab.png" alt="K2 Kebab Rovigo" class="sponsor-img" onerror="this.style.display='none'">
    </div>

    <!-- Sezione Rosa Giocatori -->
    <div class="roster-section">
      <h2>Rosa Squadra</h2>
      
      <div class="roster-category">
        <h3>Centrocampisti</h3>
        <ul class="roster-list">
          <li>Elia Bertazzo</li>
        </ul>
      </div>
    </div>

    <!-- Pulsanti / Link -->
    <div class="links">
      <a href="https://www.instagram.com/phoenix_rovigo/" class="link-btn" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.tiktok.com/@phoenix_rovigo" class="link-btn" target="_blank" rel="noopener">TikTok</a>
    </div>
  </div>

</body>
</html>
