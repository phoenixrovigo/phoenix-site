<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX ROVIGO</title>
    <style>
        :root {
            --primary: #00f2fe;
            --accent: #4facfe;
            --bg: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-dim: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.05) 0%, transparent 20%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .nav-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000;
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.3);
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        /* Sezione Rosa */
        .role-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin: 15px 0 10px 0;
            text-align: left;
            font-weight: 700;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            text-align: left;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Sponsor K2 Kebab senza spazio extra */
        .sponsor-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .sponsor-card img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
        }

        /* Social Link */
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .social-link:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>PHOENIX ROVIGO</h1>
        <p>Official Team Web App</p>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('rosa')">ROSA</button>
        <button class="tab-btn" onclick="switchTab('sponsor')">SPONSOR</button>
        <button class="tab-btn" onclick="switchTab('social')">SOCIAL</button>
    </div>

    <!-- SEZIONE ROSA -->
    <div id="rosa" class="content-section active">
        <div class="role-title">Portieri</div>
        <div class="player-card"><span>Portiere 1</span></div>

        <div class="role-title">Difensori</div>
        <div class="player-card"><span>Difensore 1</span></div>

        <div class="role-title">Centrocampisti</div>
        <div class="player-card"><span>Elia Bertazzo</span></div>

        <div class="role-title">Attaccanti</div>
        <div class="player-card"><span>Attaccante 1</span></div>
    </div>

    <!-- SEZIONE SPONSOR -->
    <div id="sponsor" class="content-section">
        <div class="sponsor-card">
            <img src="k2-kebab.png" alt="K2 Kebab Rovigo" onerror="this.style.display='none'">
        </div>
    </div>

    <!-- SEZIONE SOCIAL -->
    <div id="social" class="content-section">
        <a href="https://www.instagram.com/phoenix_rovigo/" target="_blank" class="social-link">Instagram</a>
        <a href="https://www.tiktok.com/@phoenix_rovigo" target="_blank" class="social-link">TikTok</a>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }
</script>

</body>
</html>
