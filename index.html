<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX - Official Web App</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #e31b23;
            --primary-dark: #b31217;
            --bg-dark: #0d0d0d;
            --bg-card: #171717;
            --bg-card-hover: #222222;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-gold: #ffd700;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #000000;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            padding-bottom: 40px;
        }

        /* HEADER & NAVBAR HORIZONTAL */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--primary);
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px;
        }

        .brand-logo-icon {
            width: 42px;
            height: 42px;
            background: rgba(227, 27, 35, 0.15);
            color: var(--primary);
            border-radius: 50%;
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .brand-header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav.nav-tabs {
            display: flex;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 0 10px 12px 10px;
            gap: 8px;
        }

        nav.nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(227, 27, 35, 0.5);
        }

        /* MAIN CONTENT AREA */
        main {
            padding: 20px;
            flex-grow: 1;
        }

        .page-section {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .page-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CARD STYLES */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .card-header i {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .card-header h2 {
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* HERO HOME */
        .hero-banner {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(180deg, rgba(227,27,35,0.15) 0%, rgba(23,23,23,0) 100%);
            border-radius: 20px;
            border: 1px solid rgba(227,27,35,0.3);
            margin-bottom: 25px;
        }

        .hero-logo-icon {
            width: 80px;
            height: 80px;
            background: rgba(227, 27, 35, 0.15);
            color: var(--primary);
            border-radius: 50%;
            border: 3px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 15px auto;
            filter: drop-shadow(0 0 15px rgba(227,27,35,0.4));
        }

        .hero-banner h2 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 600;
        }

        /* BANNER POST UFFICIALE */
        .official-post-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
            padding: 10px 18px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.85rem;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(225, 48, 108, 0.3);
            transition: transform 0.2s ease;
        }

        .official-post-btn:active {
            transform: scale(0.96);
        }

        /* QUICK STATS */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
